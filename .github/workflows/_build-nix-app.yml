# Reusable workflow: build a single nix-derived Docker image and push a
# (multi-arch) image to GHCR.
#
# Flow:  meta (tags)  ->  build (matrix per platform, native runners,
#         per-arch tag push)  ->  merge (imagetools create)
#
# Caller passes:
#   package:   flake package name (under #packages.<system>)
#   platforms: JSON array as a string, e.g. '["linux/amd64","linux/arm64"]'
#
# Conventions:
#   - image:   imageName/imageTag are evaluated from the flake package
#              (e.g. ghcr.io/ushitora-anqou/waq:dev). Unlike ket-containers,
#              final tags are rolling tags generated by metadata-action
#              (branch, sha-*, vX.Y.Z), so there is no existence check/skip:
#              every run rebuilds and re-tags.
#   - build:   `nix build .#<package>` resolves to the runner's native
#              system, so each platform builds natively (no emulation).
#   - tags:    each platform pushes <version>-linux-<arch> first; the final
#              tags are created atomically by the merge job, so a partial
#              final tag can never exist mid-build.
#   - buildx:  pinned to v0.31.0 in merge (docker/buildx#3708: imagetools
#              create is broken on GHCR since v0.31.1).

name: Reusable - build nix app image

on:
  workflow_call:
    inputs:
      package:
        description: Flake package name.
        required: true
        type: string
      platforms:
        description: >-
          JSON array of target platforms as a string,
          e.g. '["linux/amd64","linux/arm64"]'. Expanded as the build matrix.
        required: true
        type: string

permissions:
  contents: read
  packages: write

jobs:
  # ── Meta: image name from the flake, final tags from the event ────────────
  meta:
    name: ${{ inputs.package }} - meta
    runs-on: ubuntu-latest
    outputs:
      repo: ${{ steps.flake-meta.outputs.repo }}
      build_tag: ${{ steps.flake-meta.outputs.build_tag }}
      tags: ${{ steps.meta.outputs.tags }}
      version: ${{ steps.meta.outputs.version }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - uses: cachix/install-nix-action@v31

      - name: Extract image metadata from the flake
        id: flake-meta
        env:
          PACKAGE: ${{ inputs.package }}
        shell: bash
        run: |
          set -euo pipefail
          meta="$(nix eval --json ".#${PACKAGE}" --apply 'p: {repo = p.imageName; tag = p.imageTag;}')"
          repo="$(printf '%s' "$meta" | jq -r .repo)"
          build_tag="$(printf '%s' "$meta" | jq -r .tag)"
          {
            echo "repo=${repo}"
            echo "build_tag=${build_tag}"
          } >> "$GITHUB_OUTPUT"

      - name: Log in to the Container registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.flake-meta.outputs.repo }}

  # ── Per-platform build (native runner, per-arch tag push) ─────────────────
  build:
    name: ${{ inputs.package }} - build - ${{ matrix.platform }}
    needs: meta
    # NOTE: do NOT use matrix.include for platform->runner mapping.
    # If the include entry's platform value isn't in the matrix, GitHub Actions
    # treats it as a NEW combination and spawns an unwanted extra build.
    # Use an inline ternary instead. runs-on supports expressions.
    runs-on: ${{ contains(matrix.platform, 'arm64') && 'ubuntu-26.04-arm' || 'ubuntu-latest' }}
    strategy:
      fail-fast: false
      matrix:
        platform: ${{ fromJSON(inputs.platforms) }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - uses: cachix/install-nix-action@v31

      - uses: cachix/cachix-action@v14
        with:
          name: waq
          authToken: "${{ secrets.CACHIX_AUTH_TOKEN }}"

      - name: Log in to the Container registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # `nix build .#<package>` resolves to the runner's native system:
      # packages.x86_64-linux on amd64, packages.aarch64-linux on arm64.
      - name: Build the Docker image with nix
        run: |
          nix build .#${{ inputs.package }}

      - name: Load image and push per-arch tag
        id: push
        env:
          REPO: ${{ needs.meta.outputs.repo }}
          BUILD_TAG: ${{ needs.meta.outputs.build_tag }}
          VERSION: ${{ needs.meta.outputs.version }}
          PLATFORM: ${{ matrix.platform }}
        shell: bash
        run: |
          set -euo pipefail
          docker load -i result
          safe="${PLATFORM//\//-}"  # linux/arm64 -> linux-arm64
          per_arch="${REPO}:${VERSION}-${safe}"
          docker tag "${REPO}:${BUILD_TAG}" "${per_arch}"
          docker push "${per_arch}"
          digest="$(docker inspect --format '{{index .RepoDigests 0}}' "${per_arch}" | cut -d@ -f2)"
          if [ -z "$digest" ] || [ "$digest" = "null" ]; then
            echo "::error::No digest produced for ${{ inputs.package }} (${PLATFORM})"
            exit 1
          fi
          mkdir -p /tmp/digest
          printf '%s\n' "$digest" > "/tmp/digest/digest-${safe}.txt"
          echo "safe=${safe}" >> "$GITHUB_OUTPUT"
          echo "Pushed ${{ inputs.package }} (${PLATFORM}): ${per_arch} ${digest}" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Upload digest
        uses: actions/upload-artifact@v4
        with:
          name: digest-${{ inputs.package }}-${{ steps.push.outputs.safe }}
          path: /tmp/digest
          retention-days: 1
          if-no-files-found: error

  # ── Merge: create the final multi-arch tags atomically ────────────────────
  merge:
    name: ${{ inputs.package }} - merge
    needs: [meta, build]
    runs-on: ubuntu-latest
    steps:
      - name: Log in to the Container registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx (pinned)
        uses: docker/setup-buildx-action@v4
        with:
          # docker/buildx#3708: imagetools create is broken on GHCR since v0.31.1.
          version: v0.31.0

      - name: Download per-platform digests
        uses: actions/download-artifact@v4
        with:
          pattern: digest-${{ inputs.package }}-*
          path: digests
          merge-multiple: true

      - name: Merge multi-arch manifest
        env:
          REPO: ${{ needs.meta.outputs.repo }}
          TAGS: ${{ needs.meta.outputs.tags }}
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t files < <(find digests -type f -print | sort)
          if [ "${#files[@]}" -lt 1 ]; then
            echo "::error::No digest files found for ${{ inputs.package }}"
            exit 1
          fi
          sources=()
          for f in "${files[@]}"; do
            d="$(tr -d '[:space:]' < "$f")"
            case "$d" in
              sha256:*) : ;;
              *) echo "::error::Bad digest in $f: $d"; exit 1 ;;
            esac
            sources+=("${REPO}@${d}")
          done
          tag_args=()
          while IFS= read -r t; do
            [ -n "$t" ] || continue
            tag_args+=(-t "$t")
          done <<< "${TAGS}"
          if [ "${#tag_args[@]}" -lt 1 ]; then
            echo "::error::No final tags produced by metadata-action"
            exit 1
          fi
          echo "Merging ${#files[@]} arch(s) -> ${#tag_args[@]} tag(s)" | tee -a "$GITHUB_STEP_SUMMARY"
          docker buildx imagetools create "${tag_args[@]}" "${sources[@]}"

      - name: Verify merged manifests
        env:
          TAGS: ${{ needs.meta.outputs.tags }}
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r t; do
            [ -n "$t" ] || continue
            echo "::group::${t}"
            docker buildx imagetools inspect "${t}" | tee -a "$GITHUB_STEP_SUMMARY"
            echo "::endgroup::"
          done <<< "${TAGS}"
