# https://docs.github.com/en/actions/publishing-packages/publishing-docker-images
name: Publish Docker image to ghcr.io

on:
  workflow_dispatch:
  push:
    tags:
      - "*"
    branches:
      - master

# Granted here (not only in _build-nix-app.yml) because a called reusable
# workflow may not request more permissions than the caller's GITHUB_TOKEN.
permissions:
  contents: read
  packages: write

jobs:
  # waq has a single image (the flake's `docker` package). Each platform
  # builds natively on its own runner (arm64 on ubuntu-26.04-arm), then the
  # reusable workflow merges them into multi-arch tags atomically.
  build-and-push-image:
    uses: ./.github/workflows/_build-nix-app.yml
    with:
      package: docker
      platforms: '["linux/amd64","linux/arm64"]'
    secrets: inherit
