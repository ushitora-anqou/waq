---
# A tiny HTTP server that serves a fixed page with Open Graph meta tags, used
# by the e2e tests to check preview card generation. Serving the page from the
# cluster keeps the tests independent from external sites: www.youtube.com
# answers crawls from CI runner IPs with a redirect to www.google.com/sorry,
# which makes card generation (and thus the tests) fail sporadically.
apiVersion: v1
kind: ConfigMap
metadata:
  name: ogp-server-html
  namespace: e2e
data:
  index.html: |
    <!DOCTYPE html>
    <html>
      <head>
        <meta property="og:title" content="Waq e2e test page" />
        <meta property="og:description" content="A test page served by the e2e OGP server" />
        <meta property="og:site_name" content="ogp-server" />
        <title>Waq e2e test page</title>
      </head>
      <body>Waq e2e test page</body>
    </html>
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ogp-server
  namespace: e2e
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ogp-server
  template:
    metadata:
      labels:
        app: ogp-server
    spec:
      containers:
        - name: nginx
          image: nginx:1
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
              name: http
          volumeMounts:
            - name: html
              mountPath: /usr/share/nginx/html
              readOnly: true
      volumes:
        - name: html
          configMap:
            name: ogp-server-html
---
apiVersion: v1
kind: Service
metadata:
  name: ogp-server
  namespace: e2e
spec:
  selector:
    app: ogp-server
  ports:
    - port: 80
      name: http
